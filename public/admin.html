<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | Quadrafort's Quantum Risk Readiness Survey</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/site.css"></head><body><header class="survey-header"><a class="brand" href="/" aria-label="Survey home"><img src="/img/quadrafort-logo.png" alt="Quadrafort Technologies"></a><a class="exit" href="/">Exit administration</a></header><main class="container admin-wrap" id="main"><section id="login-panel" class="question-card admin-login"><div class="eyebrow">SECURE ADMINISTRATION</div><h1>Quadrafort's Quantum Risk Readiness Survey</h1><p>Sign in to view and manage survey responses.</p><div id="login-error" class="form-error" role="alert"></div><form id="login-form"><label class="field-label" for="username">Username</label><input class="field" id="username" name="username" autocomplete="username" required maxlength="100"><label class="field-label" for="password">Password</label><input class="field" id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><div class="survey-controls"><span></span><button class="button" type="submit">Sign in</button></div></form></section><section id="dashboard" hidden><div class="admin-toolbar"><div><div class="eyebrow">ADMIN DASHBOARD</div><h1>Survey responses</h1></div><div class="button-row"><a class="button secondary small" href="/api/admin/responses.csv">Export CSV</a><button class="button secondary small" id="logout">Sign out</button></div></div><div id="stats" class="admin-stats" aria-live="polite"></div><section class="question-card"><h2>Responses by date</h2><div id="daily-chart" aria-label="Daily response counts"></div></section><section class="question-card" style="margin-top:18px"><div class="admin-toolbar"><div><h2>Question breakdown</h2><label class="field-label" for="question-filter">Survey question</label><select class="field-select" id="question-filter"></select></div><div><label class="field-label" for="chart-sector">Sector filter</label><select class="field-select" id="chart-sector"><option value="">All sectors</option></select></div></div><div class="contact-grid"><div><label class="field-label" for="chart-from">From date</label><input class="field" id="chart-from" type="date"></div><div><label class="field-label" for="chart-to">To date</label><input class="field" id="chart-to" type="date"></div></div><div style="height:320px"><canvas id="question-chart" role="img" aria-label="Answer distribution for selected survey question"></canvas></div></section><section class="question-card" style="margin-top:18px"><div class="admin-toolbar"><h2>Response list</h2><div><label class="visually-hidden" for="search">Search responses</label><input class="field" id="search" type="search" placeholder="Search name, email or organization"></div></div><div class="contact-grid"><div><label class="field-label" for="sector-filter">Sector</label><select class="field-select" id="sector-filter"><option value="">All sectors</option></select></div><div><label class="field-label" for="from-date">From date</label><input class="field" id="from-date" type="date"></div><div><label class="field-label" for="to-date">To date</label><input class="field" id="to-date" type="date"></div></div><p id="list-error" class="form-error" role="alert"></p><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Name</th><th>Organization</th><th>Sector</th><th>Score</th><th>Actions</th></tr></thead><tbody id="response-rows"></tbody></table></div><div class="survey-controls"><button class="button secondary small" id="previous-page" type="button">Previous</button><span id="page-info" aria-live="polite"></span><button class="button secondary small" id="next-page" type="button">Next</button></div></section><section class="question-card" id="detail-panel" style="margin-top:18px" hidden></section></section></main><script src="/js/chart.umd.js" defer></script><script src="/js/admin.js" defer></script></body></html>
